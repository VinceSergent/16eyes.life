<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>16eyes</title>
<style>
:root { --sans: "Helvetica Neue", Helvetica, Arial, sans-serif; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: #000; color: #e9e9e9; font-family: var(--sans); overflow: hidden; }
#grain { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; opacity: .16; mix-blend-mode: screen; image-rendering: pixelated; }
.lines { position: fixed; inset: 0; z-index: 3; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.35) 0 1px, transparent 1px 3px); }
.vig { position: fixed; inset: 0; z-index: 3; pointer-events: none; background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.85) 100%); }
main { position: relative; z-index: 1; min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
form { display: grid; gap: 18px; justify-items: center; width: min(320px, 100%); animation: on 1.2s ease-out both; }
@keyframes on { 0% { opacity: 0; filter: blur(6px); transform: scaleY(.02); } 30% { opacity: 1; transform: scaleY(.02); } 60% { transform: scaleY(1); filter: blur(2px); } 100% { filter: blur(.3px); } }
.logo { font-weight: 700; font-size: 34px; letter-spacing: -.03em; text-shadow: 0 0 14px rgba(255,255,255,.35); }
.cap { font-weight: 700; font-size: 9px; letter-spacing: .3em; text-transform: uppercase; color: #8a8a8a; }
input { width: 100%; background: transparent; border: 0; border-bottom: 1px solid #555; color: #fff; padding: 10px 2px;
  font: 700 16px var(--sans); letter-spacing: .3em; text-align: center; outline: none; border-radius: 0; }
input:focus { border-bottom-color: #fff; }
button { background: none; border: 0; color: #bbb; cursor: pointer; font: 700 10px var(--sans); letter-spacing: .3em; text-transform: uppercase; padding: 6px 10px; }
button:hover, button:focus-visible { color: #fff; text-shadow: 0 0 10px rgba(255,255,255,.6); outline: none; }
.msg { min-height: 14px; font-weight: 700; font-size: 9px; letter-spacing: .24em; text-transform: uppercase; color: #ddd; }
.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.back { position: fixed; z-index: 4; top: 14px; left: 16px; color: #777; font: 700 9px var(--sans); letter-spacing: .26em; text-transform: uppercase; text-decoration: none; }
.back:hover { color: #fff; }
</style>
</head>
<body>
<canvas id="grain" aria-hidden="true"></canvas>
<div class="lines" aria-hidden="true"></div><div class="vig" aria-hidden="true"></div>
<a class="back" href="/">← 16eyes</a>
<main>
  <form id="f" autocomplete="off">
    <div class="logo">16eyes</div>
    <div class="cap">this part isn't open yet</div>
    <label class="cap" for="pw" style="position:absolute;left:-9999px">password</label>
    <input id="pw" type="password" placeholder="password" autocapitalize="none" spellcheck="false" autofocus>
    <button type="submit">enter</button>
    <div class="msg" id="msg" role="status"></div>
  </form>
</main>
<script>
(() => {
  const f = document.getElementById('f'), pw = document.getElementById('pw'), msg = document.getElementById('msg');
  f.addEventListener('submit', async e => {
    e.preventDefault();
    if (!pw.value.trim()) return pw.focus();
    msg.textContent = '...';
    let r = null;
    try { r = await fetch('/api/deep/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw.value }) }); } catch (err) {}
    if (r && r.ok) { msg.textContent = 'come in'; setTimeout(() => location.reload(), 350); return; }
    const why = r && r.status === 429 ? 'too many tries. wait a few minutes.' : r && r.status === 503 ? 'not ready yet.' : 'wrong.';
    msg.textContent = why; pw.value = ''; f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake'); pw.focus();
  });

  // film grain
  const c = document.getElementById('grain'), g = c.getContext('2d');
  const W = 160, H = 100; c.width = W; c.height = H;
  const img = g.createImageData(W, H);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function frame() {
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) { const v = Math.random() * 255 | 0; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
    g.putImageData(img, 0, 0);
    if (!reduce) setTimeout(() => requestAnimationFrame(frame), 50);
  }
  frame();
})();
</script>
</body>
</html>
